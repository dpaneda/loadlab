[package]
name = "loadlab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Programmable Linux workload laboratory"
readme = "README.md"

[dependencies]
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
meval = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
libc = "0.2"
prometheus = { version = "0.14", default-features = false }
num_cpus = "1.17"
core_affinity = "0.8"
# The file-backed memory controller needs a temporary file it owns end to end: created with
# O_EXCL and mode 0600, never truncated below a live mapping, and unlinked on drop. `tempfile`
# is the tested implementation of exactly that, and it is already in the tree for the tests.
tempfile = "3"

[dev-dependencies]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
